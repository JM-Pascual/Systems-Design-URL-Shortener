# Local Postgres + Redis for this tier. `docker compose up -d` inside this
# folder, then point the app at both with DATABASE_URL / REDIS_URL.
#
# Host ports are offset from Tier 4.1's defaults (5434/6380 -> 5435/6381) so
# both tiers' stacks can run side by side without a port clash.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    # `redis-stack-server`, not plain `redis`, from this tier on: the
    # existence-check Bloom filter needs the RedisBloom module (BF.* commands),
    # which vanilla Redis doesn't ship.
    image: redis/redis-stack-server:7.4.0-v3
    restart: unless-stopped
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
