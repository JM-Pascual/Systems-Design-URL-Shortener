# Local Postgres + Redis + MinIO for this tier. `docker compose up -d` inside
# this folder; the app's defaults already point at all three.
#
# Host ports are offset from Tier 4.1's defaults (5434/6380 -> 5435/6381) so
# both tiers' stacks can run side by side without a port clash.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener -d shortener"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis:
    # `redis-stack-server`, not plain `redis`, from this tier on: the
    # existence-check Bloom filter needs the RedisBloom module (BF.* commands),
    # which vanilla Redis doesn't ship.
    image: redis/redis-stack-server:7.4.0-v3
    restart: unless-stopped
    environment:
      # appendonly: the Bloom filter lives in Redis, and rebuilding it after a
      # plain restart would be wasted work.
      REDIS_ARGS: "--appendonly yes"
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  minio:
    # MinIO stopped publishing its own images, so this is the community fork.
    # The app only speaks S3, so any compatible server can replace it.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    entrypoint: sh
    # A top-level directory is a bucket, so `mkdir` creates it on first start.
    command: -c "mkdir -p /data/bloom-snapshots && exec minio server /data"
    environment:
      MINIO_ROOT_USER: shortener
      MINIO_ROOT_PASSWORD: shortener-secret
    ports:
      - "9002:9000"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  pgdata:
  redisdata:
  miniodata:
